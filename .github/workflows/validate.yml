name: Validate plugin

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Claude manifests with official CLI
        run: |
          npx --yes --package @anthropic-ai/claude-code@2.1.272 claude plugin validate plugins/workwork
          npx --yes --package @anthropic-ai/claude-code@2.1.272 claude plugin validate .claude-plugin/marketplace.json

      - name: Validate marketplace and plugin
        run: python3 scripts/validate.py

      - name: Check installer syntax
        run: bash -n scripts/install-workwork-plugin.sh

      - name: Test installer behavior
        run: bash tests/test-installer.sh

      - name: Build Claude direct-upload package
        run: |
          plugin_version="$(python3 -c 'import json; print(json.load(open("plugins/workwork/.claude-plugin/plugin.json"))["version"])')"
          node scripts/package-workwork-claude-plugin.mjs --output /tmp/workwork-claude-plugin.zip --version "${plugin_version}"
          unzip -t /tmp/workwork-claude-plugin.zip
