name: Validate plugin

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate marketplace and plugin
        run: python3 scripts/validate.py

      - name: Check installer syntax
        run: bash -n scripts/install-workwork-plugin.sh

      - name: Test installer behavior
        run: bash tests/test-installer.sh
